<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow" />
<title>Suportezap</title>
<link rel="icon" href="img/icone.svg" type="image/svg+xml">
<style>
html, body {
font-family: system-ui, sans-serif;
color: #10b77f;
background-color: #fafafa;
width: 100%;
height: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
margin: 0;
padding: 0;
line-height: 1.5;
user-select: none;
}
h2 {
margin: 0;
margin-bottom: 5px;
text-align: center;
}
p {
margin-top: 0;
margin-bottom: 25px;
}
#loading {
width: fit-content;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 10px;
font-size: 20px;
}
#success {
display: none;
width: fit-content;
flex-direction: column;
align-items: center;
justify-content: center;
}
button {
display: flex;
align-items: center;
justify-content: center;
border: none;
outline: none;
padding: 10px 18px;
border-radius: 6px;
cursor: pointer;
font-weight: 600;
font-size: 14px;
font-family: inherit;
user-select: none;
}
.botao-verde {
background-color: #10b77f;
color: #fff;
border-radius: 6px !important;
min-width: 100px;
gap: 5px;
}
.botao-verde:hover {
background-color: #0fa573;
}
</style>
</head>
<body>
<div id="loading">
<img src="img/loading.svg" width="48" height="48">
<h2>Carregando, aguarde...</h2>
</div>
<div id="success">
<span style="font-size: 52px">🥳</span>
<h2>Parabéns! Você assinou o Suportezap!</h2>
<br><br>
<button id="acessarAtendezap" class="botao-verde">Ir para o Suportezap</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.3/dist/confetti.browser.js"></script>
<script>
setTimeout(() => {
document.getElementById("loading").style.display = 'none';
document.getElementById("success").style.display = 'flex';
document.title = "Sucesso!";
confetti({
particleCount: 100,
spread: 70,
origin: { y: 0.6 },
zIndex: 9999
})
}, 4000);
document.getElementById("acessarAtendezap").addEventListener('click', () => {
window.location.href = "app";
});
</script>
</body>
</html>
