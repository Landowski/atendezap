<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar – Atendezap</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" href="img/icone.svg" type="image/svg+xml">
</head>
<body>
  <div id="content">
        <div class="container-login">
            <a href="index" class="logo" style="margin-bottom: 40px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10b77f"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 13a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M8 21v-1a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v1" /><path d="M15 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M17 10h2a2 2 0 0 1 2 2v1" /><path d="M5 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M3 13v-1a2 2 0 0 1 2 -2h2" /></svg>
                <span style="font-size: 27px; font-weight: 700; color: #10b77f;">Atendezap</span>
            </a>
            <div id="popLogin">
                <div class="login-container">
                    <form id="login-form">
                        <input class="input-login" type="email" id="login-email" placeholder="E-mail" required>
                        <div class="pass-group">
                            <input class="input-login" type="password" id="login-password" placeholder="Senha" required>
                            <div id="btnToggle" class="toggle">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-.722-3.25"/><path d="M2 8a10.645 10.645 0 0 0 20 0"/><path d="m20 15-1.726-2.05"/><path d="m4 15 1.726-2.05"/><path d="m9 18 .722-3.25"/></svg>
                            </div>
                        </div>
                        <button type="submit" id="botaoLogin">Entrar</button>
                        <div id="textoEsqueci" style="display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-lock"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <span>Esqueceu a senha? Digite seu e-mail e clique aqui</span>
                        </div>
                    </form>
                </div>
            </div>
            <div class="conta" style="margin-top: 40px;">
                <span>Não tem conta? <a href="cadastro">CADASTRE-SE</a></span>
            </div>
        </div>
  </div>
  <script src="firebase/firebase-app.js"></script>
  <script src="firebase/firebase-auth.js"></script>
  <script src="firebase/firebase-firestore.js"></script>
  <script src="firebase/firebase-config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
